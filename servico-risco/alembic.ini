# Configuração do Alembic do Serviço de Risco.
# A URL do banco NÃO fica aqui: o migrations/env.py a lê de app.config
# (RISCO_DATABASE_URL, ou RISCO_TESTES_DATABASE_URL com "-x banco=teste").

[alembic]
script_location = %(here)s/migrations
# Deixa o pacote "app" importável pelo env.py.
prepend_sys_path = .
# Separa os caminhos acima pelo separador do sistema (o Alembic recomenda declarar).
path_separator = os
# Nomes dos arquivos das revisões: 0001_criar_trechos_criticos.py etc.
file_template = %%(rev)s_%%(slug)s
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
