# PostgreSQL local da API HelmCare (só o banco; a API roda com dotnet run).
# A senha vem do api/.env (veja o .env.example), que nunca é versionado.
name: helmcare-api

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: helmcare_api
      POSTGRES_USER: helmcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure api/.env}
    # Só na interface local: o banco não fica exposto na rede.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helmcare -d helmcare_api"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados-postgres:
